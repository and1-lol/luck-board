
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Press Your Luck Board</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 20px 12px;
    background: #d60000;
    font-family: Arial, sans-serif;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  #board {
    position: relative;
    width: min(100%, 600px);
    aspect-ratio: 1;
    margin: 0 auto 24px;
    padding: 7px;
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    grid-template-rows: repeat(5, minmax(0, 1fr));
    gap: 5px;
    background: #990000;
    border: 5px solid #ffeb00;
    border-radius: 8px;
    box-shadow: 0 0 18px #700000;
  }

  .tile {
    display: flex;
    justify-content: center;
    align-items: center;
    min-width: 0;
    min-height: 0;
    border: 2px solid #dddddd;
    border-radius: 3px;
    background: #ffffff;
    color: #d60000;
    font-size: clamp(15px, 3.8vw, 27px);
    font-weight: 900;
    position: relative;
  }

  .tile.active {
    outline: 5px solid #ffeb00;
    outline-offset: -5px;
    z-index: 2;
  }

  #center {
    grid-column: 2 / 5;
    grid-row: 2 / 5;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    text-align: center;
    overflow: hidden;
    background: #990000;
    border: 2px solid white;
    border-radius: 4px;
    color: white;
    font-weight: 900;
    transform: none;
  }

  #center.winner {
    font-size: clamp(55px, 14vw, 100px);
  }

  #center.logo {
    font-size: clamp(20px, 5vw, 38px);
    line-height: 1.05;
    color: #ffeb00;
    text-shadow:
      2px 2px 0 #d60000,
      -2px -2px 0 #d60000,
      0 0 8px #ffeb00;
    transform: none;
  }

  #center.logo .press {
    font-size: 0.75em;
    color: white;
  }

  button {
    padding: 16px 44px;
    border: 3px solid #ffeb00;
    border-radius: 6px;
    background: #ffffff;
    color: #d60000;
    font-size: 22px;
    font-weight: 900;
    cursor: pointer;
    touch-action: manipulation;
  }

  button:active {
    transform: scale(0.96);
  }

  @media (max-width: 380px) {
    #board {
      gap: 3px;
      padding: 4px;
    }

    .tile {
      border-width: 1px;
    }

    .tile.active {
      outline-width: 4px;
      outline-offset: -4px;
    }
  }
</style>
</head>

<body>

<div id="board">
  <div id="center" class="logo">
    <span class="press">PRESS YOUR</span>
    <span>LUCK!</span>
  </div>
</div>

<button id="toggle">START</button>

<script>
const OPTIONS = {
  "1": "1 Candy",
  "2": "2 Candy",
  "3": "3 Candy",
  "4": "Whammie!",
  "5": "5",
  "6": "6",
  "7": "7",
  "8": "8",
  "9": "9",
  "10": "10",
  "11": "11",
  "12": "12",
  "13": "13",
  "14": "14",
  "15": "15",
  "16": "16"
};

const board = document.getElementById("board");
const center = document.getElementById("center");
const toggle = document.getElementById("toggle");

let running = false;
let stopped = false;
let activeIndex = -1;
let timer = null;

let choices = Object.values(OPTIONS);

const positions = [
  [1,1], [1,2], [1,3], [1,4], [1,5],
  [2,5], [3,5], [4,5], [5,5],
  [5,4], [5,3], [5,2], [5,1],
  [4,1], [3,1], [2,1]
];

const squares = choices.map((choice, index) => {
  const tile = document.createElement("div");
  tile.className = "tile";
  tile.textContent = choice;

  const [row, column] = positions[index];
  tile.style.gridRow = row;
  tile.style.gridColumn = column;

  board.appendChild(tile);
  return tile;
});

function shuffleTiles() {
  for (let i = choices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [choices[i], choices[j]] = [choices[j], choices[i]];
  }

  squares.forEach((square, index) => {
    square.textContent = choices[index];
  });
}

function pickRandomSquare() {
  let nextIndex;

  do {
    nextIndex = Math.floor(Math.random() * squares.length);
  } while (
    squares.length > 1 &&
    nextIndex === activeIndex
  );

  if (activeIndex !== -1) {
    squares[activeIndex].classList.remove("active");
  }

  activeIndex = nextIndex;
  squares[activeIndex].classList.add("active");
}

function gameStep() {
  shuffleTiles();
  pickRandomSquare();
}

function startBoard() {
  running = true;
  stopped = false;

  center.className = "";
  center.textContent = "";
  toggle.textContent = "STOP";

  gameStep();
  timer = setInterval(gameStep, 250);
}

function stopBoard() {
  running = false;
  stopped = true;
  clearInterval(timer);

  const winner = squares[activeIndex].textContent;

  center.className = "winner";
  center.textContent = winner;
  toggle.textContent = "RESET";
}

function resetBoard() {
  running = false;
  stopped = false;
  clearInterval(timer);

  if (activeIndex !== -1) {
    squares[activeIndex].classList.remove("active");
  }

  activeIndex = -1;
  choices = Object.values(OPTIONS);

  squares.forEach((square, index) => {
    square.textContent = choices[index];
  });

  center.className = "logo";
  center.innerHTML =
    '<span class="press">PRESS YOUR</span><span>LUCK!</span>';

  toggle.textContent = "START";
}

toggle.addEventListener("click", () => {
  if (running) {
    stopBoard();
  } else if (stopped) {
    resetBoard();
  } else {
    startBoard();
  }
});
</script>

</body>
</html>
