
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Press Your Luck</title>

<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  body {
    height: 100vh;
    height: 100dvh;
    padding: 8px;
    background: #d60000;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  #board {
    position: relative;
    width: min(88vw, calc(100dvh - 100px), 600px);
    aspect-ratio: 1;
    flex-shrink: 1;
    min-width: 0;
    min-height: 0;
    padding: 5px;
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    grid-template-rows: repeat(5, minmax(0, 1fr));
    gap: 4px;
    background: #990000;
    border: 5px solid #ffeb00;
    border-radius: 8px;
    box-shadow: 0 0 18px #700000;
  }

  .tile {
    display: flex;
    justify-content: center;
    align-items: center;
    min-width: 0;
    min-height: 0;
    padding: 1px;
    border: 2px solid #dddddd;
    border-radius: 3px;
    background: #ffffff;
    color: #d60000;
    font-size: clamp(11px, 2.8vw, 24px);
    font-weight: 900;
    text-align: center;
    overflow-wrap: anywhere;
  }

  .tile.active {
    outline: 5px solid #ffeb00;
    outline-offset: -5px;
    z-index: 2;
  }

  #center {
    grid-column: 2 / 5;
    grid-row: 2 / 5;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    text-align: center;
    overflow: hidden;
    background: #990000;
    border: 2px solid white;
    border-radius: 4px;
    color: white;
    font-weight: 900;
    transform: none;
    min-width: 0;
    min-height: 0;
  }

  #center.winner {
    font-size: clamp(22px, 5vw, 48px);
    line-height: 1.05;
    overflow-wrap: anywhere;
    padding: 4px;
  }

  #center.logo {
    font-size: clamp(18px, 4.5vw, 36px);
    line-height: 1.05;
    color: #ffeb00;
    text-shadow:
      2px 2px 0 #d60000,
      -2px -2px 0 #d60000,
      0 0 8px #ffeb00;
  }

  #center.logo .press {
    font-size: 0.75em;
    color: white;
  }

  #toggle {
    flex-shrink: 0;
    padding: 10px 32px;
    border: 3px solid #ffeb00;
    border-radius: 6px;
    background: #ffffff;
    color: #d60000;
    font-size: clamp(16px, 2.5vh, 22px);
    font-weight: 900;
    cursor: pointer;
    touch-action: manipulation;
  }

  #toggle:active {
    transform: scale(0.96);
  }

  @media (max-height: 500px) {
    body {
      flex-direction: row;
      gap: 12px;
    }

    #board {
      width: min(78vh, calc(100dvh - 16px), 600px);
    }

    #toggle {
      padding: 10px 16px;
    }
  }

  @media (max-width: 380px) {
    #board {
      gap: 3px;
      padding: 3px;
      border-width: 4px;
    }

    .tile {
      border-width: 1px;
    }

    .tile.active {
      outline-width: 4px;
      outline-offset: -4px;
    }
  }
</style>
</head>

<body>

<div id="board">
  <div id="center" class="logo">
    <span class="press">PRESS YOUR</span>
    <span>LUCK!</span>
  </div>
</div>

<button id="toggle" type="button">START</button>

<script>
const OPTIONS = {
  "1": "1 Candy",
  "2": "2 Candy",
  "3": "3 Candy",
  "4": "Out",
  "5": "Out",
  "6": "Out",
  "7": "Out",
  "8": "Out",
  "9": "2 Candy",
  "10": "4 Candy",
  "11": "3 Candy",
  "12": "Ramen",
  "13": "2x or 0",
  "14": "Again",
  "15": "Slim Jim",
  "16": "Out"
};

const board = document.getElementById("board");
const center = document.getElementById("center");
const toggle = document.getElementById("toggle");

let running = false;
let stopped = false;
let activeIndex = -1;
let timer = null;
let choices = Object.values(OPTIONS);

const positions = [
  [1,1], [1,2], [1,3], [1,4], [1,5],
  [2,5], [3,5], [4,5], [5,5],
  [5,4], [5,3], [5,2], [5,1],
  [4,1], [3,1], [2,1]
];

const squares = choices.map((choice, index) => {
  const tile = document.createElement("div");
  tile.className = "tile";
  tile.textContent = choice;

  const [row, column] = positions[index];
  tile.style.gridRow = row;
  tile.style.gridColumn = column;

  board.appendChild(tile);
  return tile;
});

function shuffleTiles() {
  for (let i = choices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [choices[i], choices[j]] = [choices[j], choices[i]];
  }

  squares.forEach((square, index) => {
    square.textContent = choices[index];
  });
}

function pickRandomSquare() {
  let nextIndex;

  do {
    nextIndex = Math.floor(Math.random() * squares.length);
  } while (
    squares.length > 1 &&
    nextIndex === activeIndex
  );

  if (activeIndex !== -1) {
    squares[activeIndex].classList.remove("active");
  }

  activeIndex = nextIndex;
  squares[activeIndex].classList.add("active");
}

function gameStep() {
  shuffleTiles();
  pickRandomSquare();
}

function startBoard() {
  running = true;
  stopped = false;

  center.className = "";
  center.textContent = "";
  toggle.textContent = "STOP";

  gameStep();
  timer = setInterval(gameStep, 250);
}

function stopBoard() {
  running = false;
  stopped = true;
  clearInterval(timer);

  const winner = squares[activeIndex].textContent;

  center.className = "winner";
  center.textContent = winner;
  toggle.textContent = "RESET";
}

function resetBoard() {
  running = false;
  stopped = false;
  clearInterval(timer);

  if (activeIndex !== -1) {
    squares[activeIndex].classList.remove("active");
  }

  activeIndex = -1;
  choices = Object.values(OPTIONS);

  squares.forEach((square, index) => {
    square.textContent = choices[index];
  });

  center.className = "logo";
  center.innerHTML =
    '<span class="press">PRESS YOUR</span><span>LUCK!</span>';

  toggle.textContent = "START";
}

toggle.addEventListener("click", () => {
  if (running) {
    stopBoard();
  } else if (stopped) {
    resetBoard();
  } else {
    startBoard();
  }
});

// USB arcade button: Gamepad API button B0 (index 0).
let arcadeWasPressed = false;
let gamepadIndex = null;

function checkArcadeButton() {
  let pressed = false;
  const gamepads = navigator.getGamepads
    ? navigator.getGamepads()
    : [];

  // Find a connected gamepad, including after a reconnect.
  if (gamepadIndex === null ||
      !gamepads[gamepadIndex]) {
    gamepadIndex = null;

    for (const gamepad of gamepads) {
      if (gamepad) {
        gamepadIndex = gamepad.index;
        break;
      }
    }
  }

  if (gamepadIndex !== null) {
    const gamepad = gamepads[gamepadIndex];

    if (gamepad && gamepad.buttons[0]) {
      pressed = gamepad.buttons[0].pressed;
    }
  }

  // One action per press; release before pressing again.
  if (pressed && !arcadeWasPressed) {
    toggle.click();
  }

  arcadeWasPressed = pressed;

  requestAnimationFrame(checkArcadeButton);
}

requestAnimationFrame(checkArcadeButton);
</script>

</body>
</html>
